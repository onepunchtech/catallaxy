[package]
name = "cata"
version = "0.7.0"
edition = "2024"
description = "CLI for catallaxy - declarative Kubernetes platform management"
authors = ["Catallaxy Contributors"]
license = "MIT"
repository = "https://github.com/onepunchtech/catallaxy"
homepage = "https://onepunchtech.github.io/catallaxy"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }

tokio = { version = "1.40", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

anyhow = "1.0"
thiserror = "1.0"

which = "6.0"

dirs = "5.0"

console = "0.15"

rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

tempfile = "3.10"

walkdir = "2"

chrono = "0.4"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

pretty = "0.12"

yaml-rust2 = "0.10"

rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
x509-parser = "0.16"
pem = "3.0"
time = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[lib]
name = "cata"
path = "src/lib.rs"

[[bin]]
name = "cata"
path = "src/bin/cata.rs"

[[bin]]
name = "cata-build"
path = "src/bin/cata-build.rs"
